[project]
name = "coding-router"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.2",
    "fastapi>=0.141.1",
    "fire>=0.7.1",
    "huggingface-hub>=0.30",
    # Local routing embeddings (Qwen3-Embedding-0.6B): MLX on Apple Silicon, torch
    # (CUDA when available) everywhere else. Routing never calls an embeddings API.
    "mlx-embeddings>=0.1.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=2.5.1",
    "openai>=2.50.0",
    "pydantic>=2.13.4",
    "sentence-transformers>=3.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "uvicorn>=0.52.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
    "ty>=0.0.65",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ty.src]
exclude = ["data/", "results/"]

[tool.setuptools.packages.find]
include = ["router*"]
