[project]
name = "coding-router"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.2",
    "datasets>=5.0.1",
    "e2b>=2.35.0",
    "fire>=0.7.1",
    "huggingface-hub>=1.26.0",
    "numpy>=2.5.1",
    "openai>=2.50.0",
    "pyarrow>=25.0.0",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
    "ty>=0.0.65",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ty.src]
exclude = ["data/", "results/"]

[tool.setuptools.packages.find]
include = ["router*"]
